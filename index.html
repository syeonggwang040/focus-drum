<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몰입 드럼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* layout: 지금(다이얼·시작) / 설정 / 기록 세 구역을 세로로 쌓음 — 공부 중에는 '지금'만 보면 되도록 */
:root{
  --bg:#eef1ee; --panel:#f8faf8; --fg:#18201b; --muted:#5a665f; --line:#d2dad4;
  --accent:#2F6B4F; --on-accent:#ffffff; --step:#4A6A8A; --step-dim:#d5ddd7;
  --display:"Martian Mono",ui-monospace,Consolas,monospace;
  --body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101412; --panel:#171c19; --fg:#e6ece8; --muted:#8f9b94; --line:#29312c;
  --accent:#6FBF94; --on-accent:#0E1F16; --step:#93AEC9; --step-dim:#26302b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --panel:#171c19; --fg:#e6ece8; --muted:#8f9b94; --line:#29312c;
  --accent:#6FBF94; --on-accent:#0E1F16; --step:#93AEC9; --step-dim:#26302b; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px 48px;display:grid;gap:20px}
h1{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--muted)}
h2{font-size:15px;margin:0}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:16px}
.stage{justify-items:center;text-align:center;gap:18px;padding-block:28px}
.pick{border:0;margin:0;padding:0;min-width:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
/* 뽀모도로 다이얼: 남은 시간만큼 색 링이 12시 방향으로 줄어듦 (눈금 12칸) */
.dial{--c:var(--accent);width:min(280px,72vw);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--panel) 0 .7deg,transparent .7deg 30deg),conic-gradient(var(--c) 0 var(--p,100%),var(--step-dim) 0)}
.dial[data-phase="break"]{--c:var(--step)}
.dial[data-phase="idle"]{--c:color-mix(in srgb,var(--accent) 35%,var(--step-dim))}
[hidden]{display:none!important}
.face{position:absolute;inset:13%;border-radius:50%;background:var(--panel);display:grid;place-content:center;justify-items:center;gap:8px}
.timer{font-family:var(--display);font-size:clamp(34px,10vw,50px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.chip{font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;background:var(--step-dim);color:var(--fg)}
.dial[data-phase="focus"] .chip{background:var(--accent);color:var(--on-accent)}
.dial[data-phase="break"] .chip{background:var(--step);color:var(--panel)}
#end{justify-self:center}
.attitude{display:grid;gap:6px;width:min(100%,420px);text-align:left}
.attitude label{font-size:14px;font-weight:600}
.attitude label small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
/* 형광펜: 글자 아래쪽 절반에 색을 칠함 */
mark,.att-edit b{font-weight:600;color:inherit;background:linear-gradient(transparent 50%,color-mix(in srgb,var(--accent) 42%,transparent) 50%)}
.att-edit{min-height:1.55em;outline:none;white-space:nowrap;overflow-x:auto;cursor:text}
.att-edit:empty::before{content:attr(data-placeholder);color:var(--muted)}
.att-edit:focus-visible{outline:2px solid var(--step);outline-offset:2px}
.att-edit,.reflect input{font:inherit;color:var(--fg);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;box-sizing:border-box}
.att-input{display:flex;gap:8px}
.att-input input{flex:1;min-width:0}
.att-input button{flex:none;align-self:stretch}
.att-recent{display:flex;gap:6px;flex-wrap:wrap}
.att-recent button{font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-line{margin:0;max-width:420px;font-size:15px;line-height:1.5;color:var(--fg);text-wrap:balance}
.att-line::before{content:"태도";display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.reflect{display:grid;gap:14px;width:min(100%,420px);text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.reflect-title{margin:0;font-weight:600}
.scale{display:grid;gap:6px}
.scale-q{font-size:14px}
.dots{display:flex;gap:8px}
.dots button{width:40px;height:40px;padding:0;border-radius:50%;font-variant-numeric:tabular-nums}
.dots button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ends{display:flex;justify-content:space-between;width:calc(5 * 40px + 4 * 8px);font-size:12px;color:var(--muted)}
.reflect-btns{display:flex;gap:8px}
li.rec{display:grid;gap:2px}
li.rec .top{display:flex;justify-content:space-between;gap:12px}
li.rec .att{font-size:14px;color:var(--muted)}
.dial.paused{--c:var(--muted)}
.dial.paused .chip{background:var(--muted);color:var(--panel)}
.status{margin:0;display:grid;gap:2px}
#state{font-weight:600}
#next{font-size:14px;color:var(--muted)}
button{font:600 15px var(--body);border-radius:10px;padding:12px 20px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.big{width:min(100%,320px);padding:16px;font-size:17px;border-radius:14px}
/* 모바일: 시작 버튼을 엄지가 닿는 화면 하단에 고정 */
@media (max-width:600px){
  button.big{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .wrap{padding-bottom:110px}
}
button:focus-visible,input:focus-visible{outline:2px solid var(--step);outline-offset:2px}
.aux{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:600}
.sliders{display:flex;gap:12px 24px;flex-wrap:wrap}
.sliders label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sliders input{width:120px;accent-color:var(--accent)}
.seq{display:grid;gap:3px;max-width:100%;overflow-x:auto}
.row{display:grid;grid-template-columns:repeat(16,12px);gap:3px}
.cell{width:12px;height:12px;border-radius:2px;background:var(--step-dim)}
.cell.on{background:var(--step)}
.cell.now{outline:1.5px solid var(--accent);outline-offset:1px}
.log{display:grid;gap:16px}
.summary{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap}
.summary>div{display:grid;gap:2px}
.big-num{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big-num small{font-family:var(--body);font-size:16px;margin-left:4px}
.mid-num{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.cap{font-size:13px;color:var(--muted)}
/* 최근 7일 막대: 단일 계열(집중 분), 오늘만 진하게 + 값 라벨, 나머지는 툴팁 */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.day{position:relative;display:grid;gap:6px;justify-items:center;border-radius:6px;outline-offset:2px}
.col{height:96px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.bar{width:min(28px,70%);border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 55%,var(--panel))}
.today .bar{background:var(--accent)}
.v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.d{font-size:13px;color:var(--muted)} .today .d{color:var(--fg);font-weight:600}
.day:hover::before,.day:focus-visible::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  white-space:nowrap;background:var(--fg);color:var(--bg);font-size:13px;padding:3px 8px;border-radius:6px;z-index:2;pointer-events:none}
.day.l::before{left:0;transform:none} .day.r::before{left:auto;right:0;transform:none}
.day:focus-visible{outline:2px solid var(--step)}
#list{display:grid;gap:16px}
#list h3{display:flex;justify-content:space-between;font-size:14px;margin:0 0 4px}
#list h3 span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
li small{color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.cycles{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.cycles legend{font-size:14px;font-weight:600;padding:0;margin-bottom:8px}
.cycles legend small{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.cycles:disabled{opacity:.75}
.cyc{display:grid;grid-template-columns:1.5em minmax(0,1fr) auto;align-items:center;gap:8px 12px;font-size:14px}
.pair{display:flex;flex-wrap:wrap;gap:6px 20px}
#cycleList{display:grid;gap:10px}
.cyc .n{font-family:var(--display);font-size:13px;color:var(--muted);width:1.5em}
.cyc.now .n{color:var(--accent);font-weight:600}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:3.5em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
button.step{width:32px;height:32px;padding:0;font-size:17px;line-height:1;justify-self:auto}
.settings{display:block}
.settings summary{display:flex;align-items:baseline;gap:10px;cursor:pointer;list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings summary span{font-size:13px;color:var(--muted)}
.settings summary::after{content:"";margin-left:auto;align-self:center;width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.settings[open] summary::after{transform:rotate(-135deg)}
.settings summary:focus-visible{outline:2px solid var(--step);outline-offset:4px;border-radius:4px}
.settings-body{display:grid;gap:20px;margin-top:20px}
.ratio-wrap{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.ratio{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.ratio .f{background:var(--accent)} .ratio .b{background:var(--step)}
.sheet{display:grid;gap:8px}
.sheet h3{font-size:14px;margin:0}
.sheet h3 small{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.sheet-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sheet-row label{min-width:5.5em}
.sheet-row input{font:inherit;color:var(--fg);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);flex:1;min-width:0}
#sheetPin{flex:0 0 7em}
button.danger{border-color:var(--accent);color:var(--accent);font-weight:600}
.sets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.setname{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.setname input{font:inherit;color:var(--fg);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:12em;max-width:100%}
button.small{padding:4px 10px;font-size:13px;font-weight:400;justify-self:start}
button:disabled{cursor:default;opacity:.5}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>몰입 드럼</h1>
  <section class="deck stage" aria-label="지금">
    <fieldset class="pick" id="setPick" aria-label="몰입할 세트"><div class="sets" id="setTabs" role="tablist"></div></fieldset>
    <div class="attitude" id="attBox">
      <label id="attLabel" for="attitude">이번 세션의 태도 <small>지금을 fully 살아 내는 방식을 적어 보세요 · 강조할 단어는 선택 후 Ctrl+B</small></label>
      <div class="att-input"><div id="attitude" class="att-edit" contenteditable="true" role="textbox" aria-labelledby="attLabel" data-placeholder="비워 두면 추천 태도로 시작해요"></div><button type="button" class="small" id="attSuggest">추천받기</button></div>
      <div class="att-recent" id="attRecent"></div>
    </div>
    <p class="att-line" id="attLine" hidden></p>
    <div class="dial" id="dial" data-phase="idle">
      <div class="face"><div class="timer" id="timer">50:00</div><div class="chip" id="chip">준비</div></div>
    </div>
    <p class="status" aria-live="polite"><span id="state"></span><span id="next"></span></p>
    <form class="reflect" id="reflect" hidden>
      <p class="reflect-title" id="reflectTitle"></p>
      <div class="scale" role="radiogroup" aria-label="충만" data-k="full"><span class="scale-q">얼마나 충만했나요?</span><span class="dots"></span><span class="ends"><span>흘려보냄</span><span>온전히 충만</span></span></div>
      <div class="scale" role="radiogroup" aria-label="몰입" data-k="flow"><span class="scale-q">얼마나 fully 몰입했나요?</span><span class="dots"></span><span class="ends"><span>건성으로</span><span>fully 몰입</span></span></div>
      <input id="reflectNote" maxlength="80" autocomplete="off" placeholder="과정에서 온전히 머문 한 순간 (선택)">
      <div class="reflect-btns"><button type="submit" class="small primary" id="reflectSave">남기기</button><button type="button" class="small" id="reflectSkip">건너뛰기</button></div>
    </form>
    <button class="primary big" id="toggle">몰입 시작하기</button>
    <button class="small" id="end" hidden>끝내기</button>
    <div class="aux"><button class="small" id="regen">새 비트</button><button class="small" id="pip" hidden>미니 창</button></div>
    <div class="stats"><span>몰입 <b id="focusSum">0</b>분</span><span>탭 이탈 <b id="leaves">0</b>회</span><span><b id="bpm">—</b> BPM</span></div>
    <div class="seq" id="seq" aria-label="현재 드럼 패턴" hidden></div>
  </section>
  <details class="deck settings">
    <summary><h2>설정</h2><span>볼륨 · 미니 창 · 주기 세트</span></summary>
    <div class="settings-body">
    <div class="sliders">
      <label for="vol">볼륨 <input id="vol" type="range" min="-36" max="0" value="-10"></label>
      <label id="pipDimWrap" for="pipDim" hidden>미니 창 선명도 <input id="pipDim" type="range" min="20" max="100" value="100"></label>
    </div>
    <div class="sheet">
      <h3>구글 시트에 기록 저장 <small id="sheetStatus" aria-live="polite">연결 안 됨</small></h3>
      <div class="sheet-row"><label for="sheetUrl">웹 앱 주소</label><input id="sheetUrl" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="sheet-row"><label for="sheetPin">PIN</label><input id="sheetPin" type="password" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="숫자 3자리">
        <button type="button" class="small" id="sheetConnect">연결</button><button type="button" class="small" id="sheetDisconnect" hidden>연결 해제</button></div>
    </div>
    <fieldset class="cycles" id="cycles">
      <legend>선택한 세트의 주기 <small>10분 단위 · 마지막 주기가 끝나면 처음부터 반복</small></legend>
      <div class="setname"><label for="setName">세트 이름</label><input id="setName" maxlength="20"><button type="button" class="small" id="addSet">+ 새 세트</button><button type="button" class="small" id="delSet">세트 삭제</button></div>
      <div class="ratio-wrap"><div class="ratio" id="ratio" aria-hidden="true"></div><span id="ratioTotal"></span></div>
      <div id="cycleList"></div>
      <button type="button" class="small" id="addCycle">+ 주기 추가</button>
    </fieldset>
    </div>
  </details>
  <section class="log">
    <h2>몰입 기록</h2>
    <div class="summary">
      <div><span class="big-num"><span id="todayMin">0</span><small>분</small></span><span class="cap">오늘 몰입</span></div>
      <div><span class="mid-num" id="weekMin">0분</span><span class="cap">최근 7일 몰입</span></div>
    </div>
    <div class="week" id="week" role="list" aria-label="최근 7일 몰입 시간"></div>
    <div id="list"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>
const ROWS = ['kick', 'snare', 'hat'], KEY = 'focus-drum-sessions', CYCLE_KEY = 'focus-drum-cycles', MAX_CYCLES = 5;
const SET_KEY = 'focus-drum-sets', ACTIVE_KEY = 'focus-drum-active-set', MAX_SETS = 3;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let sets, active = 0;
let pat, bpm, step = -1, bar = 0, running = false, startAt = 0, leaves = 0, kit = null, wake = null, tick = null;
let cycles, ci = 0, phase = 'focus', phaseStart = 0, phaseEnd = 0, phaseTimer = null, focusMs = 0, rounds = 0;
let paused = false, pausedAt = 0, autoEndTimer = null;
const AUTO_END = 30 * 60000; // 이만큼 멈춰 있으면 자동으로 끝내고 기록
const nowT = () => paused ? pausedAt : Date.now(); // 일시정지 중에는 시간이 흐르지 않음

// 로파이 힙합 감성의 16스텝 패턴을 확률로 생성 (값 = 세기 0~1)
function generate() {
  const r = Math.random, p = { kick: [], snare: [], hat: [] };
  for (let i = 0; i < 16; i++) {
    p.kick[i] = i === 0 || i === 8 ? 1 : i % 2 === 0 ? (r() < .2 ? .7 : 0) : (r() < .08 ? .5 : 0);
    p.snare[i] = i === 4 || i === 12 ? .9 : (r() < .07 ? .2 : 0);
    p.hat[i] = i % 2 === 0 ? (r() < .9 ? .45 + r() * .3 : 0) : (r() < .3 ? .15 + r() * .2 : 0);
  }
  return p;
}

function newBeat(changeTempo) {
  pat = generate();
  if (changeTempo) { bpm = 70 + Math.floor(Math.random() * 20); Tone.Transport.bpm.value = bpm; $('bpm').textContent = bpm; }
  draw();
}

const cells = {};
function buildGrid() {
  for (const k of ROWS) {
    const row = document.createElement('div'); row.className = 'row';
    cells[k] = [];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('div'); c.className = 'cell';
      row.append(c); cells[k].push(c);
    }
    $('seq').append(row);
  }
}
function draw() {
  for (const k of ROWS) cells[k].forEach((c, i) => {
    c.classList.toggle('on', pat[k][i] > 0);
    c.style.opacity = pat[k][i] > 0 ? .35 + pat[k][i] * .65 : 1;
    c.classList.toggle('now', i === step);
  });
}

function buildKit() {
  const vol = new Tone.Volume(+$('vol').value).connect(new Tone.Filter(4500, 'lowpass').toDestination());
  const kick = new Tone.MembraneSynth({ pitchDecay: .05, octaves: 6, envelope: { attack: .001, decay: .45, sustain: 0 } }).connect(vol);
  const snare = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: .001, decay: .18, sustain: 0 } }).connect(new Tone.Filter(1800, 'bandpass').connect(vol));
  const hat = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: .001, decay: .04, sustain: 0 } }).connect(new Tone.Filter(7000, 'highpass').connect(vol));
  hat.volume.value = -10;

  return url && a && a.until > Date.now() ? { url, pin: a.pin, until: a.until } : null;
}
function renderSheetStatus(msg) {
  const auth = sheetAuth(), u = auth && new Date(auth.until);
  $('sheetDisconnect').hidden = !auth;
  $('sheetStatus').textContent = msg || (auth ? `연결됨 · ${u.getMonth() + 1}/${u.getDate()}까지 유지`
    : getLS(SHEET_URL_KEY, '') ? 'PIN을 입력하면 1주일 동안 연결이 유지돼요' : '연결 안 됨');
}
async function callSheet(url, body) {
  const r = await fetch(url, { method: 'POST', body: JSON.stringify(body) }); // text/plain 이라 사전 요청 없음
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  return data;
}
let syncing = false;
async function sync() {
  const auth = sheetAuth();
  if (!auth || syncing) return renderSheetStatus();
  syncing = true; renderSheetStatus('동기화 중…');
  try {
    const pending = load().filter(s => !s.synced && !s.draft);
    if (pending.length) await callSheet(auth.url, { pin: auth.pin, action: 'add', sessions: pending.map(s => ({ ...s, id: sid(s) })) });
    const { sessions } = await callSheet(auth.url, { pin: auth.pin, action: 'list' });
    const sent = new Set(pending.map(sid)), fromSheet = sessions.map(s => ({ ...s, synced: true }));
    const newer = load().filter(s => !s.synced && !sent.has(sid(s))); // 전송 중에 새로 생긴 기록
    save([...fromSheet, ...newer].sort((a, b) => a.start - b.start));
    renderLog(); renderSheetStatus();
  } catch (e) {
    if (e.message === 'wrong') { setLS(SHEET_AUTH_KEY, null); renderSheetStatus('PIN이 맞지 않아요. 다시 입력해 주세요'); }
    else if (e.message === 'locked') renderSheetStatus('틀린 PIN이 많아 1시간 동안 잠겼어요');
    else renderSheetStatus('시트에 연결하지 못했어요. 기록은 이 브라우저에 두었다가 다음에 다시 보냅니다');
  } finally { syncing = false; }
}
$('sheetConnect').onclick = () => {
  const url = $('sheetUrl').value.trim(), pin = $('sheetPin').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return renderSheetStatus('웹 앱 주소는 https://script.google.com/macros/s/…/exec 형식이어야 해요');
  if (!/^\d{3}$/.test(pin)) return renderSheetStatus('PIN은 숫자 3자리예요');
  setLS(SHEET_URL_KEY, url); setLS(SHEET_AUTH_KEY, { pin, until: Date.now() + WEEK });
  $('sheetPin').value = ''; sync();
};
$('sheetDisconnect').onclick = () => { setLS(SHEET_AUTH_KEY, null); renderSheetStatus(); };

const DAY = ['일', '월', '화', '수', '목', '금', '토'];
const dayKey = t => new Date(t).toDateString();
const dayName = d => `${d.getMonth() + 1}/${d.getDate()} (${DAY[d.getDay()]})`;
function renderLog() {
  const list = load(), byDay = {};
  for (const s of list) byDay[dayKey(s.start)] = (byDay[dayKey(s.start)] || 0) + s.ms;
  // 오늘 포함 최근 7일, 기록 없는 날은 0
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - 6 + i);
    return { d, min: Math.floor((byDay[d.toDateString()] || 0) / 60000) };
  });
  const max = Math.max(1, ...days.map(x => x.min));
  $('todayMin').textContent = days[6].min;
  $('weekMin').textContent = hm(days.reduce((a, x) => a + x.min, 0));
  $('week').innerHTML = days.map((x, i) => {
    const tip = `${dayName(x.d)} · ${hm(x.min)}`, side = i < 2 ? ' l' : i > 4 ? ' r' : '';
    return `<div class="day${side}${i === 6 ? ' today' : ''}" role="listitem" tabindex="0" aria-label="${tip}" data-tip="${tip}">
      <div class="col">${i === 6 && x.min ? `<span class="v">${hm(x.min)}</span>` : ''}<div class="bar" style="height:${x.min ? Math.max(4, x.min / max * 80) : 0}px"></div></div>
      <span class="d">${i === 6 ? '오늘' : DAY[x.d.getDay()]}</span></div>`;
  }).join('');
  // 최근 20건을 날짜별로 묶음
  const groups = new Map();
  for (const s of list.slice(-20).reverse()) { const k = dayKey(s.start); groups.has(k) ? groups.get(k).push(s) : groups.set(k, [s]); }
  $('list').innerHTML = groups.size ? [...groups].map(([k, ss]) => `<section>
    <h3>${dayName(new Date(k))}<span>${hm(Math.floor(ss.reduce((a, s) => a + s.ms, 0) / 60000))}</span></h3>
    <ol>${ss.map(s => { const t = new Date(s.start);
      const extra = [s.attitude && `“${marked(s.attitude)}”`, avg(s.full) && `충만 ${avg(s.full)}`, avg(s.flow) && `몰입 ${avg(s.flow)}`, s.note && esc(s.note)].filter(Boolean).join(' · ');
      return `<li class="rec"><div class="top"><span>${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}</span><span>${Math.round(s.ms / 60000)}분 <small>${s.set ? `· ${esc(s.set)} ` : ''}${s.rounds != null ? `· 몰입 ${s.rounds}회 ` : ''}· 이탈 ${s.leaves}회</small></span></div>${extra ? `<div class="att">${extra}</div>` : ''}</li>`;
    }).join('')}</ol></section>`).join('') : '<p class="empty">1분 이상 몰입하면 여기에 날짜별로 쌓입니다.</p>';
}

async function lockScreen() { try { wake = await navigator.wakeLock?.request('screen'); } catch {} }

async function start() {
  openPip(); // 클릭 직후에 호출해야 브라우저가 창을 열어 줌
  try { if (Notification.permission === 'default') Notification.requestPermission(); } catch {}
  closeReflect(false); // 지난 세션의 돌아봄 창이 열려 있으면 그대로 확정
  if (!getAtt()) setAtt(suggestAtt()); // 비워 두면 추천 태도로 시작
  attitude = getAtt(); rememberAtt(attitude); renderAttRecent();
  fulls = []; flows = [];
  $('attBox').hidden = true; $('attLine').hidden = !attitude; $('attLine').innerHTML = marked(attitude);
  await Tone.start();
  kit ??= buildKit();
  running = true; paused = false; startAt = Date.now(); leaves = 0; focusMs = 0; rounds = 0;
  $('leaves').textContent = 0; $('focusSum').textContent = 0; $('cycles').disabled = $('setPick').disabled = true;
  $('end').hidden = false;
  enterPhase(0, 'focus');
  lockScreen();
  tick = setInterval(renderTick, 250);
}
function renderTick() {
  const left = Math.max(0, phaseEnd - nowT()), t = fmt(left);
  $('timer').textContent = t; $('focusSum').textContent = Math.floor(focusNow() / 60000);
  $('dial').style.setProperty('--p', `${left / (phaseEnd - phaseStart) * 100}%`);
  document.title = `${paused ? '⏸ ' : ''}${t} ${phase === 'focus' ? '몰입' : '휴식에 몰입'} · 몰입 드럼`;
  updatePip();
}

function stop(auto) {
  const ms = focusNow();
  running = false; paused = false; clearInterval(tick); clearTimeout(phaseTimer); clearTimeout(autoEndTimer);
  $('dial').classList.remove('paused'); $('end').hidden = true;
  $('attBox').hidden = false; $('attLine').hidden = true;
  Tone.Transport.stop(); step = -1; draw();
  wake?.release().catch(() => {}); wake = null;
  if (reflectMode === 'break') closeReflect(true);
  if (ms >= 60000) {
    const list = load(); draftId = String(startAt);
    list.push({ id: draftId, start: startAt, ms, leaves, rounds, set: sets[active].name, attitude, draft: true }); save(list);
    if (auto) finishDraft(''); else openReflect('end', `몰입 ${Math.round(ms / 60000)}분, 이 세션을 돌아봐요`);
  }
  document.title = '몰입 드럼';
  $('cycles').disabled = $('setPick').disabled = false; $('seq').hidden = true;
  document.querySelectorAll('.cyc').forEach(el => el.classList.remove('now'));
  $('toggle').textContent = '몰입 시작하기';
  renderCycles(); renderLog();
  $('next').textContent = ms >= 60000 ? `방금 몰입 ${Math.round(ms / 60000)}분을 남겼어요` : '몰입 1분 미만이라 기록하지 않았어요';
  updatePip();
}

const primary = () => !running ? start() : paused ? resume() : pause();
$('toggle').onclick = primary;
$('end').onclick = () => { if (running) stop(); };
// 스페이스바: 대기 중엔 시작, 공부 중엔 일시정지·계속 (입력칸·버튼·접기 제목에 포커스가 있으면 그쪽 동작 우선)
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, button, summary, textarea, [tabindex], [contenteditable]')) return;
  e.preventDefault(); primary();
});
$('regen').onclick = () => newBeat(true);
$('pip').hidden = !('documentPictureInPicture' in window);
$('pip').onclick = openPip;
$('pipDimWrap').hidden = $('pip').hidden;
try { $('pipDim').value = localStorage.getItem(DIM_KEY) ?? 100; } catch {}
$('pipDim').oninput = e => { applyDim(); try { localStorage.setItem(DIM_KEY, e.target.value); } catch {} };
$('vol').oninput = e => { if (kit) kit.vol.volume.value = +e.target.value; };
document.addEventListener('visibilitychange', () => {
  if (!running) return;
  if (document.hidden) { if (phase === 'focus' && !paused) $('leaves').textContent = ++leaves; } // 휴식·일시정지 중 이탈은 세지 않음
  else lockScreen(); // 탭 복귀 시 화면 꺼짐 방지 재요청
});

sets = loadSets();
try { active = Math.min(+localStorage.getItem(ACTIVE_KEY) || 0, sets.length - 1); } catch {}
buildGrid(); newBeat(true); renderSets(); renderLog();
// 돌아봄을 남기기 전에 페이지를 닫았던 세션은 그대로 확정
{ const list = load(); if (list.some(s => s.draft)) { list.forEach(s => delete s.draft); save(list); } }
renderAttRecent(); setAtt(getLS(ATT_KEY, [])[0] || '');
$('sheetUrl').value = getLS(SHEET_URL_KEY, ''); sync();
</script>
</body>
</html>
