<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집중 드럼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* layout: 한 칸짜리 연습실 — 타이머 데크, 16스텝 시퀀서, 기록 리스트를 세로로 쌓음 */
:root{
  --bg:#eceef2; --panel:#f8f9fb; --fg:#1a1d26; --muted:#5d6475; --line:#d3d7e0;
  --accent:#d9481c; --step:#2a3a8f; --step-dim:#c7cde0;
  --display:"Martian Mono",ui-monospace,Consolas,monospace;
  --body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141a; --panel:#1a1d26; --fg:#e8eaf0; --muted:#9097a8; --line:#2c303c;
  --accent:#ff7a45; --step:#8fa2ff; --step-dim:#2f3548; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --panel:#1a1d26; --fg:#e8eaf0; --muted:#9097a8; --line:#2c303c;
  --accent:#ff7a45; --step:#8fa2ff; --step-dim:#2f3548; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px 48px;display:grid;gap:20px}
h1{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--muted)}
h2{font-size:15px;margin:0}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:16px}
.timer{font-family:var(--display);font-size:clamp(40px,12vw,64px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.meta{font-family:var(--display);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:600}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:600 15px var(--body);border-radius:10px;padding:12px 20px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--step);outline-offset:2px}
.vol{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.vol input{width:110px;accent-color:var(--accent)}
.dim{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dim input{width:90px;accent-color:var(--step)}
.seq{display:grid;gap:6px;overflow-x:auto}
.row{display:grid;grid-template-columns:44px repeat(16,minmax(10px,1fr));gap:4px;align-items:center}
.row span{font-family:var(--display);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cell{aspect-ratio:1;border-radius:3px;background:var(--step-dim);max-width:100%}
.cell.beat{box-shadow:inset 0 0 0 1px var(--line)}
.cell.on{background:var(--step)}
.cell.now{outline:2px solid var(--accent);outline-offset:1px}
.log{display:grid;gap:10px}
.log header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#today{font-family:var(--display);font-size:13px;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
li small{color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.cycles{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.cycles legend{font-size:13px;font-weight:600;padding:0;margin-bottom:8px}
.cycles legend small{font-weight:400;color:var(--muted);margin-left:6px}
.cycles:disabled{opacity:.75}
.cyc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.cyc .n{font-family:var(--display);font-size:12px;color:var(--muted);width:1.5em}
.cyc.now .n{color:var(--accent);font-weight:600}
.cyc input{width:4.5em;font:inherit;font-variant-numeric:tabular-nums;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.sets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.setname{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.setname input{font:inherit;color:var(--fg);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:12em;max-width:100%}
button.small{padding:4px 10px;font-size:13px;font-weight:400;justify-self:start}
button:disabled{cursor:default;opacity:.5}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>집중 드럼</h1>
  <section class="deck">
    <div class="timer" id="timer">00:00:00</div>
    <div class="meta"><span id="state">대기 중</span><span>집중 <b id="focusSum">0</b>분</span><span>템포 <b id="bpm">—</b> BPM</span><span>탭 이탈 <b id="leaves">0</b>회</span></div>
    <div class="controls">
      <button class="primary" id="toggle">공부 시작하기</button>
      <button id="regen">새 비트</button>
      <button id="pip" hidden>미니 창</button>
      <label class="dim" id="pipDimWrap" for="pipDim" hidden>미니 창 선명도 <input id="pipDim" type="range" min="20" max="100" value="100"></label>
      <label class="vol" for="vol">볼륨 <input id="vol" type="range" min="-36" max="0" value="-10"></label>
    </div>
    <fieldset class="cycles" id="cycles">
      <legend>주기 <small>세트 최대 3개 · 세트당 주기 최대 5개 · 10분 단위 · 마지막 주기가 끝나면 처음부터 반복</small></legend>
      <div class="sets"><div class="sets" id="setTabs" role="tablist"></div><button type="button" class="small" id="addSet">+ 세트</button></div>
      <div class="setname"><label for="setName">세트 이름</label><input id="setName" maxlength="20"><button type="button" class="small" id="delSet">세트 삭제</button></div>
      <div id="cycleList"></div>
      <button type="button" class="small" id="addCycle">+ 주기 추가</button>
    </fieldset>
    <div class="seq" id="seq" aria-label="현재 드럼 패턴"></div>
  </section>
  <section class="log">
    <header><h2>공부 기록</h2><span id="today">오늘 0분</span></header>
    <ol id="list"></ol>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>
const ROWS = ['kick', 'snare', 'hat'], KEY = 'focus-drum-sessions', CYCLE_KEY = 'focus-drum-cycles', MAX_CYCLES = 5;
const SET_KEY = 'focus-drum-sets', ACTIVE_KEY = 'focus-drum-active-set', MAX_SETS = 3;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let sets, active = 0;
let pat, bpm, step = -1, bar = 0, running = false, startAt = 0, leaves = 0, kit = null, wake = null, tick = null;
let cycles, ci = 0, phase = 'focus', phaseStart = 0, phaseEnd = 0, phaseTimer = null, focusMs = 0, rounds = 0;

// 로파이 힙합 감성의 16스텝 패턴을 확률로 생성 (값 = 세기 0~1)
function generate() {
  const r = Math.random, p = { kick: [], snare: [], hat: [] };
  for (let i = 0; i < 16; i++) {
    p.kick[i] = i === 0 || i === 8 ? 1 : i % 2 === 0 ? (r() < .2 ? .7 : 0) : (r() < .08 ? .5 : 0);
    p.snare[i] = i === 4 || i === 12 ? .9 : (r() < .07 ? .2 : 0);
    p.hat[i] = i % 2 === 0 ? (r() < .9 ? .45 + r() * .3 : 0) : (r() < .3 ? .15 + r() * .2 : 0);
  }
  return p;
}

function newBeat(changeTempo) {
  pat = generate();
  if (changeTempo) { bpm = 70 + Math.floor(Math.random() * 20); Tone.Transport.bpm.value = bpm; $('bpm').textContent = bpm; }
  draw();
}

const cells = {};
function buildGrid() {
  for (const k of ROWS) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span>${k}</span>`;
    cells[k] = [];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('div'); c.className = 'cell' + (i % 4 === 0 ? ' beat' : '');
      row.append(c); cells[k].push(c);
    }
    $('seq').append(row);
  }
}
function draw() {
  for (const k of ROWS) cells[k].forEach((c, i) => {
    c.classList.toggle('on', pat[k][i] > 0);
    c.style.opacity = pat[k][i] > 0 ? .35 + pat[k][i] * .65 : 1;
    c.classList.toggle('now', i === step);
  });
}

function buildKit() {
  const vol = new Tone.Volume(+$('vol').value).connect(new Tone.Filter(4500, 'lowpass').toDestination());
  const kick = new Tone.MembraneSynth({ pitchDecay: .05, octaves: 6, envelope: { attack: .001, decay: .45, sustain: 0 } }).connect(vol);
  const snare = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: .001, decay: .18, sustain: 0 } }).connect(new Tone.Filter(1800, 'bandpass').connect(vol));
  const hat = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: .001, decay: .04, sustain: 0 } }).connect(new Tone.Filter(7000, 'highpass').connect(vol));
  hat.volume.value = -10;
  const bell = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: .005, decay: .4, sustain: 0, release: .4 } }).connect(vol);
  Tone.Transport.swing = .15; Tone.Transport.swingSubdivision = '16n';
  Tone.Transport.scheduleRepeat(time => {
    step = (step + 1) % 16;
    if (step === 0 && ++bar % 8 === 0) pat = generate(); // 8마디마다 패턴 변주
    if (pat.kick[step]) kick.triggerAttackRelease('C1', '8n', time, pat.kick[step]);
    if (pat.snare[step]) snare.triggerAttackRelease('16n', time, pat.snare[step]);
    if (pat.hat[step]) hat.triggerAttackRelease('32n', time, pat.hat[step]);
    Tone.Draw.schedule(draw, time);
  }, '16n');
  return { vol, bell };
}

// 구간 전환 신호음: 집중 시작은 올라가는 두 음, 휴식 시작은 내려가는 두 음
function chime(up) {
  const t = Tone.now(), [a, b] = up ? ['E5', 'A5'] : ['A5', 'E5'];
  kit.bell.triggerAttackRelease(a, '8n', t); kit.bell.triggerAttackRelease(b, '8n', t + .25);
}
function notify(title, body) {
  try { if (Notification.permission === 'granted') new Notification(title, { body }); } catch {}
}

// 주기 설정: [{f: 집중분, b: 휴식분}], 10분 단위
function loadCycles() {
  try { const c = JSON.parse(localStorage.getItem(CYCLE_KEY)); if (Array.isArray(c) && c.length) return c.slice(0, MAX_CYCLES); } catch {}
  return [{ f: 50, b: 10 }];
}
// 세트: [{name, cycles}] — 예전 단일 주기 설정은 '세트 1'로 옮겨 옴
function loadSets() {
  try { const s = JSON.parse(localStorage.getItem(SET_KEY)); if (Array.isArray(s) && s.length) return s.slice(0, MAX_SETS); } catch {}
  return [{ name: '세트 1', cycles: loadCycles() }];
}
function saveCycles() { try { localStorage.setItem(SET_KEY, JSON.stringify(sets)); localStorage.setItem(ACTIVE_KEY, active); } catch {} }

function renderSets() {
  cycles = sets[active].cycles;
  $('setTabs').replaceChildren(...sets.map((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'small tab'; b.textContent = s.name;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === active);
    b.onclick = () => { active = i; saveCycles(); renderSets(); };
    return b;
  }));
  $('addSet').disabled = sets.length >= MAX_SETS;
  $('delSet').disabled = sets.length === 1;
  $('setName').value = sets[active].name;
  renderCycles();
}
$('addSet').onclick = () => { sets.push({ name: `세트 ${sets.length + 1}`, cycles: [{ f: 50, b: 10 }] }); active = sets.length - 1; saveCycles(); renderSets(); };
$('delSet').onclick = () => { sets.splice(active, 1); active = Math.max(0, active - 1); saveCycles(); renderSets(); };
$('setName').oninput = e => {
  sets[active].name = e.target.value.trim() || `세트 ${active + 1}`;
  $('setTabs').children[active].textContent = sets[active].name; saveCycles();
};
const snap = (v, max, fallback) => Number.isFinite(v) ? Math.min(max, Math.max(10, Math.round(v / 10) * 10)) : fallback;

function renderCycles() {
  $('cycleList').innerHTML = cycles.map((c, i) => `<div class="cyc" data-i="${i}"><span class="n">${i + 1}</span>
    <label for="f${i}">집중 <input id="f${i}" data-k="f" type="number" min="10" max="120" step="10" value="${c.f}"> 분</label>
    <label for="b${i}">휴식 <input id="b${i}" data-k="b" type="number" min="10" max="60" step="10" value="${c.b}"> 분</label>
    <button type="button" class="small del" aria-label="주기 ${i + 1} 삭제" ${cycles.length === 1 ? 'disabled' : ''}>삭제</button></div>`).join('');
  $('addCycle').disabled = cycles.length >= MAX_CYCLES;
  if (!running) $('timer').textContent = fmt(cycles[0].f * 60000);
}
$('cycleList').addEventListener('change', e => {
  const k = e.target.dataset.k; if (!k) return;
  const c = cycles[e.target.closest('.cyc').dataset.i];
  c[k] = snap(+e.target.value, k === 'f' ? 120 : 60, c[k]);
  saveCycles(); renderCycles();
});
$('cycleList').addEventListener('click', e => {
  if (!e.target.classList.contains('del')) return;
  cycles.splice(e.target.closest('.cyc').dataset.i, 1); saveCycles(); renderCycles();
});
$('addCycle').onclick = () => { cycles.push({ f: 50, b: 10 }); saveCycles(); renderCycles(); };

function enterPhase(i, ph) {
  ci = i; phase = ph; phaseStart = Date.now();
  const mins = ph === 'focus' ? cycles[i].f : cycles[i].b;
  phaseEnd = phaseStart + mins * 60000;
  clearTimeout(phaseTimer);
  // ponytail: 구간마다 단발 setTimeout — 연쇄 타이머와 달리 백그라운드 탭에서도 분 단위로 늦춰지지 않음
  phaseTimer = setTimeout(nextPhase, phaseEnd - phaseStart);
  if (ph === 'focus') { newBeat(true); step = -1; bar = 0; Tone.Transport.start(); }
  else { Tone.Transport.stop(); step = -1; draw(); }
  $('state').textContent = `주기 ${i + 1}/${cycles.length} · ${ph === 'focus' ? '집중' : '휴식'}`;
  document.querySelectorAll('.cyc').forEach((el, j) => el.classList.toggle('now', j === i));
}
function nextPhase() {
  if (phase === 'focus') {
    focusMs += Date.now() - phaseStart; rounds++;
    notify(`집중 ${cycles[ci].f}분 완료`, `휴식 ${cycles[ci].b}분을 시작합니다. 비트를 멈춥니다.`);
    enterPhase(ci, 'break'); chime(false);
  } else {
    const n = (ci + 1) % cycles.length;
    notify('휴식 끝', `주기 ${n + 1} · 집중 ${cycles[n].f}분을 시작합니다.`);
    enterPhase(n, 'focus'); chime(true);
  }
}
const focusNow = () => focusMs + (phase === 'focus' ? Date.now() - phaseStart : 0);

// 미니 창: Document Picture-in-Picture (Chrome·Edge 데스크톱 전용), 다른 창 위에 떠 있음
let pip = null;
async function openPip() {
  if (!('documentPictureInPicture' in window) || pip) return;
  try { pip = await documentPictureInPicture.requestWindow({ width: 260, height: 140 }); } catch { return; }
  const d = pip.document;
  d.head.innerHTML = `<title>집중 드럼</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
    <style>
      html{background:#000}
      body{margin:0;height:100vh;box-sizing:border-box;padding:12px;display:flex;align-items:center;gap:14px;color:#e8eaf0;
        font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:13px;background:#1a1d26;--c:#5d6475}
      body.focus{--c:#ff7a45} body.break{--c:#8fa2ff}
      /* 뽀모도로 다이얼: 남은 시간만큼 색 부채꼴이 12시 방향으로 줄어듦, 눈금 12칸 = 5분 간격 느낌 */
      #dial{flex:none;height:calc(100vh - 24px);max-height:220px;aspect-ratio:1;border-radius:50%;position:relative;
        background:repeating-conic-gradient(rgba(0,0,0,.35) 0 .6deg,transparent .6deg 30deg),conic-gradient(var(--c) 0 var(--p,100%),rgba(255,255,255,.1) 0)}
      #dial::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#1a1d26}
      .side{display:grid;gap:2px;min-width:0}
      #ph{opacity:.7} #left{font-weight:600;font-size:18px;color:var(--c)} #sum{opacity:.7}
      button{justify-self:start;margin-top:6px;font-weight:600;font-size:13px;font-family:inherit;padding:4px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:inherit;cursor:pointer}
      [hidden]{display:none!important}
    </style>`;
  d.body.innerHTML = `<div id="dial" role="img"></div><div class="side"><div id="ph"></div><div id="left"></div><div id="sum"></div><button id="end">끝내기</button></div>`;
  applyDim();
  d.getElementById('end').onclick = () => { if (running) stop(); };
  pip.addEventListener('pagehide', () => { pip = null; });
  updatePip();
}
function updatePip() {
  if (!pip) return;
  const d = pip.document;
  const left = Math.max(0, phaseEnd - Date.now()), frac = running ? left / (phaseEnd - phaseStart) : 1;
  d.body.className = running ? phase : '';
  d.getElementById('dial').style.setProperty('--p', `${frac * 100}%`);
  d.getElementById('dial').ariaLabel = `남은 시간 ${Math.round(frac * 100)}%`;
  d.getElementById('ph').textContent = $('state').textContent;
  d.getElementById('left').textContent = running ? `${Math.ceil(left / 60000)}분 남음` : '대기 중';
  d.getElementById('sum').textContent = `집중 ${$('focusSum').textContent}분`;
  d.getElementById('end').hidden = !running;
}
// 흐림: 검은 바탕 위 본문 불투명도를 낮춤 (창 자체 투명화는 브라우저가 지원하지 않음)
const DIM_KEY = 'focus-drum-pip-opacity';
function applyDim() { if (pip) pip.document.body.style.opacity = $('pipDim').value / 100; }

const fmt = ms => { const s = Math.floor(ms / 1000); return [s / 3600, s / 60 % 60, s % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':'); };
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} }

function renderLog() {
  const list = load(), today = new Date().toDateString();
  const mins = list.filter(s => new Date(s.start).toDateString() === today).reduce((a, s) => a + s.ms, 0) / 60000;
  $('today').textContent = `오늘 ${Math.floor(mins)}분`;
  $('list').innerHTML = list.length ? list.slice(-10).reverse().map(s => {
    const d = new Date(s.start);
    return `<li><span>${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</span><span>${Math.round(s.ms / 60000)}분 <small>${s.set ? `· ${esc(s.set)} ` : ''}${s.rounds != null ? `· 집중 ${s.rounds}회 ` : ''}· 이탈 ${s.leaves}회</small></span></li>`;
  }).join('') : '<li class="empty">1분 이상 공부하면 여기에 쌓입니다.</li>';
}

async function lockScreen() { try { wake = await navigator.wakeLock?.request('screen'); } catch {} }

async function start() {
  openPip(); // 클릭 직후에 호출해야 브라우저가 창을 열어 줌
  try { if (Notification.permission === 'default') Notification.requestPermission(); } catch {}
  await Tone.start();
  kit ??= buildKit();
  running = true; startAt = Date.now(); leaves = 0; focusMs = 0; rounds = 0;
  $('leaves').textContent = 0; $('focusSum').textContent = 0; $('cycles').disabled = true;
  enterPhase(0, 'focus');
  lockScreen();
  tick = setInterval(() => {
    const t = fmt(Math.max(0, phaseEnd - Date.now()));
    $('timer').textContent = t; $('focusSum').textContent = Math.floor(focusNow() / 60000);
    document.title = `${t} ${phase === 'focus' ? '집중' : '휴식'} · 집중 드럼`;
    updatePip();
  }, 250);
  $('toggle').textContent = '공부 끝내기';
}

function stop() {
  const ms = focusNow();
  running = false; clearInterval(tick); clearTimeout(phaseTimer);
  Tone.Transport.stop(); step = -1; draw();
  wake?.release().catch(() => {}); wake = null;
  if (ms >= 60000) { const list = load(); list.push({ start: startAt, ms, leaves, rounds, set: sets[active].name }); save(list); }
  $('state').textContent = ms >= 60000 ? `집중 ${Math.round(ms / 60000)}분 기록됨` : '집중 1분 미만이라 기록하지 않았어요';
  document.title = '집중 드럼';
  $('cycles').disabled = false;
  document.querySelectorAll('.cyc').forEach(el => el.classList.remove('now'));
  $('toggle').textContent = '공부 시작하기';
  renderCycles(); renderLog(); updatePip();
}

$('toggle').onclick = () => running ? stop() : start();
$('regen').onclick = () => newBeat(true);
$('pip').hidden = !('documentPictureInPicture' in window);
$('pip').onclick = openPip;
$('pipDimWrap').hidden = $('pip').hidden;
try { $('pipDim').value = localStorage.getItem(DIM_KEY) ?? 100; } catch {}
$('pipDim').oninput = e => { applyDim(); try { localStorage.setItem(DIM_KEY, e.target.value); } catch {} };
$('vol').oninput = e => { if (kit) kit.vol.volume.value = +e.target.value; };
document.addEventListener('visibilitychange', () => {
  if (!running) return;
  if (document.hidden) { if (phase === 'focus') $('leaves').textContent = ++leaves; } // 휴식 중 이탈은 세지 않음
  else lockScreen(); // 탭 복귀 시 화면 꺼짐 방지 재요청
});

sets = loadSets();
try { active = Math.min(+localStorage.getItem(ACTIVE_KEY) || 0, sets.length - 1); } catch {}
buildGrid(); newBeat(true); renderSets(); renderLog();
</script>
</body>
</html>
